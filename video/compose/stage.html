<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Explainer stage</title>
<link rel="stylesheet" href="../fonts/web/fonts.css">
<style>
  :root {
    --paper: #f4efe6;
    --paper-deep: #ebe3d6;
    --ink: #2c3e50;          /* the app's own --primary */
    --ink-soft: #6b7785;
    --mark: #f6d77e;         /* highlighter for key terms */
    --teal: #26a69a;         /* the app's booking teal */
    --indigo: #5c6bc0;       /* the app's booking indigo */
    --amber: #e5b829;        /* the app's third accent */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); }
  body { font-family: 'Inter Caption', sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  .layer { position: absolute; inset: 0; }
  .paper { position: absolute; inset: 0;
    background: radial-gradient(ellipse 120% 90% at 40% 35%, #f8f4ec 0%, var(--paper) 55%, var(--paper-deep) 100%); }

  /* ---------- footage scenes ---------- */
  .card { position: absolute; left: 48px; top: 48px; width: 1536px; height: 864px; border-radius: 14px; overflow: hidden;
    background: #fff; box-shadow: 0 2px 4px rgba(44,62,80,.08), 0 18px 48px rgba(44,62,80,.16); }
  .cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
  .cam img.frame { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  .cursor { position: absolute; left: 0; top: 0; width: 30px; height: 30px; transform-origin: 0 0; }
  .ripple { position: absolute; border-radius: 50%; border: 3px solid rgba(38,166,154,.9); pointer-events: none; }
  .ring { position: absolute; border: 4px solid var(--amber); border-radius: 10px; box-shadow: 0 0 0 6px rgba(229,184,41,.18); }

  .caption { position: absolute; left: 48px; top: 940px; width: 1536px; height: 110px; display: flex; align-items: center; justify-content: center;
    font-family: 'Literata', serif; font-size: 40px; line-height: 1.25; text-align: center; letter-spacing: -0.2px; }
  .caption .line { position: absolute; width: 100%; padding: 0 40px; }
  mark { background: none; color: inherit; padding: 0 .12em; margin: 0 -.04em; border-radius: .18em;
    background-image: linear-gradient(transparent 12%, var(--mark) 12%, var(--mark) 88%, transparent 88%);
    -webkit-box-decoration-break: clone; box-decoration-break: clone; white-space: nowrap; }

  .steps { position: absolute; left: 1624px; top: 48px; width: 260px; }
  .steps h3 { margin: 6px 0 26px; font: 600 15px/1.2 'Inter Caption'; letter-spacing: 1.6px; text-transform: uppercase; color: var(--ink-soft); }
  .step { display: flex; align-items: center; gap: 16px; height: 74px; position: relative; }
  .step .dot { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none;
    font: 600 18px 'Inter Caption'; border: 2px solid #c9c1b3; color: #a39a8c; background: var(--paper); position: relative; z-index: 1; }
  .step .lbl { font: 400 22px/1.2 'Literata'; color: #a39a8c; }
  .step.on .dot { background: var(--ink); border-color: var(--ink); color: #fff; }
  .step.on .lbl { color: var(--ink); font-weight: 600; }
  .step.done .dot { border-color: var(--teal); color: var(--teal); }
  .step.done .lbl { color: var(--ink-soft); }
  .steps .rail { position: absolute; left: 19px; top: 104px; width: 2px; height: 222px; background: #d8d0c2; }

  .tip { position: absolute; width: 560px; padding: 22px 26px 24px; border-radius: 12px; background: #fffdf8;
    box-shadow: 0 2px 6px rgba(44,62,80,.10), 0 14px 36px rgba(44,62,80,.18); border-left: 6px solid var(--amber); }
  .tip .k { font: 600 14px 'Inter Caption'; letter-spacing: 1.8px; color: #a07b0c; text-transform: uppercase; margin-bottom: 8px; }
  .tip .t { font: 400 27px/1.3 'Literata'; }
  kbd { font: 600 .82em 'Inter Caption'; border: 1.5px solid #b9b0a1; border-bottom-width: 3px; border-radius: 6px; padding: .02em .32em; background: #fff; }

  /* ---------- title ---------- */
  .title-wrap { position: absolute; left: 180px; top: 300px; width: 1200px; }
  .eyebrow { font: 600 20px 'Inter Caption'; letter-spacing: 3px; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 26px; }
  .title { font: 600 104px/1.02 'Literata'; letter-spacing: -2px; margin: 0; }
  .sub { font: 400 38px/1.35 'Literata'; color: #47556a; margin-top: 30px; max-width: 1000px; }
  .blocks { position: absolute; left: 1420px; top: 250px; width: 330px; height: 560px; }
  .blocks div { position: absolute; border-radius: 8px; }

  /* ---------- desk (real-world ending) ---------- */
  .desk-scene { position: absolute; inset: 0; overflow: hidden; }
  .end-card { position: absolute; left: 80px; top: 88px; width: 680px; padding: 34px 38px 36px; border-radius: 14px; background: rgba(255,253,248,.96);
    box-shadow: 0 2px 6px rgba(44,62,80,.10), 0 18px 44px rgba(44,62,80,.22); }
  .end-card .k { font: 600 16px 'Inter Caption'; letter-spacing: 2px; text-transform: uppercase; color: var(--ink-soft); }
  .end-card .url { font: 600 31px/1.2 'Literata'; margin: 14px 0 20px; letter-spacing: -.3px; white-space: nowrap; }
  .end-card .t { font: 400 28px/1.35 'Literata'; color: #47556a; }
</style>
</head>
<body>
<div id="root"></div>
<script src="../out/clips/index.js"></script>
<script src="desk.js"></script>
<script src="script.js"></script>
<script src="stage.js"></script>
</body>
</html>
