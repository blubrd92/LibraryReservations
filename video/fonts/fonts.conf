<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Filming-only font setup. The app asks for 'Segoe UI', which Linux lacks.
     Selawik is Microsoft's open-source, metric-compatible stand-in for Segoe UI,
     so we rename it to 'Segoe UI' at scan time: Chromium then uses it for the
     app's first-choice family and every line wraps where it would on Windows. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir>FONTDIR</dir>
  <cachedir>CACHEDIR</cachedir>
  <match target="scan">
    <test name="family"><string>Selawik</string></test>
    <edit name="family" mode="assign" binding="same"><string>Segoe UI</string></edit>
  </match>
</fontconfig>
